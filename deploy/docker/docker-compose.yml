# n8n-ts baseline — satu service, restart otomatis, healthcheck /healthz.
# Jalankan dari repo root:  bash scripts/start.sh   (atau docker compose -f deploy/docker/docker-compose.yml up -d --build)
name: n8n-ts-baseline

services:
  n8n-ts:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: n8n-ts-baseline:0.1.0
    container_name: n8n-ts-baseline
    restart: unless-stopped
    env_file:
      - path: ../../.env
        required: false
    environment:
      HOST: "0.0.0.0"
      PORT: "${PORT:-5678}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      BODY_LIMIT_BYTES: "${BODY_LIMIT_BYTES:-1048576}"
      EXECUTION_TIMEOUT_MS: "${EXECUTION_TIMEOUT_MS:-30000}"
      N8N_LOCALE: "${N8N_LOCALE:-id}"
      NODE_ENV: "${NODE_ENV:-production}"
    ports:
      - "${PORT:-5678}:${PORT:-5678}"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const p=process.env.PORT||5678;fetch('http://127.0.0.1:'+p+'/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
