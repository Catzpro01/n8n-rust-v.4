# Docker Compose for the TypeScript runtime.
#
#   cp .env.example .env
#   docker compose -f deploy/docker/docker-compose.yml up -d --build
#   docker compose -f deploy/docker/docker-compose.yml logs -f
#
# Behind a reverse proxy nothing else is needed: the runtime binds 0.0.0.0 and
# sends no framing restrictions, so it can be proxied (and iframed) directly.
name: n8n-ts-runtime

services:
  n8n-ts:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: n8n-ts-runtime:latest
    container_name: n8n-ts-runtime
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      N8N_TS_HOST: 0.0.0.0
      N8N_TS_DATA_DIR: /data
      N8N_TS_PID_FILE: /data/runtime.pid
      N8N_TS_ENV: production
      N8N_TS_LOG_FORMAT: json
    ports:
      - "${N8N_TS_PORT:-5678}:5678"
    volumes:
      - n8n-ts-data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5678/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  n8n-ts-data:
