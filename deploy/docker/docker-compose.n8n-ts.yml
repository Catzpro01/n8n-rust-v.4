# TypeScript baseline stack (no Rust)
# Usage (from repo root):
#   docker compose -f deploy/docker/docker-compose.n8n-ts.yml up -d --build
services:
  n8n-ts:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.n8n-ts
    image: n8n-ts-baseline:0.4.0
    container_name: n8n-ts-baseline
    ports:
      - "${N8N_TS_PORT:-5678}:5678"
    environment:
      NODE_ENV: production
      N8N_TS_HOST: "0.0.0.0"
      N8N_TS_PORT: "5678"
      N8N_LOCALE: "${N8N_LOCALE:-id}"
      N8N_TS_LOG_LEVEL: "${N8N_TS_LOG_LEVEL:-info}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:5678/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 8s
