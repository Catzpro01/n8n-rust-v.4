[package]
name = "n8n-validation"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
# OrderedValue objects are IndexMaps (n8n-connection precedent): document
# order must survive the parse for collect-all error order (fixture X15).
# Deliberately NOT serde_json/preserve_order: that unifies workspace-wide
# and would silently break n8n-workflow's BTreeMap-backed checksum.
indexmap.workspace = true
