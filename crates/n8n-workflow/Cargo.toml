[package]
name = "n8n-workflow"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "LEGO 'workflow': pure workflow domain model of n8n (Rust port). Phase 3 of the LEGO lifecycle (RUST IMPLEMENTED)."

[dependencies]
# Intentionally ZERO external dependencies (std only):
# - the pure domain model needs no IO, no HTTP, no DB (golden invariant);
# - the sandbox/VPS pipeline may not reach crates.io (offline constraint).

[lib]
name = "n8n_workflow"
path = "src/lib.rs"

[[bin]]
name = "n8n-workflow-compat"
path = "src/bin/compat.rs"
