# Agent registry — reconciled for the live worker session runtime (#295).
#
# Two different things live here and must not be confused:
#
#   worker_slots  The TEN canonical workforce CAPACITY slots (AGENT-01..AGENT-10). Canonical source:
#                 docs/engineering-operations/workforce/policy.json#workerSlots (DEC-0010: slots are
#                 open capacity, not owners of any LEGO, sub-LEGO, PR, task or runner). A slot is ONLINE
#                 only while a live session is registered and heartbeating in the workforce runtime
#                 (tools/workforce/src/session-runtime.mjs); nothing in this file makes a slot ONLINE.
#                 Status: node tools/workforce/src/cli.mjs runtime-status
#
#   agents        LEGACY sub-LEGO ownership records (pre-workforce, 5 agents + manager). Kept only because
#                 tools/sublego-audit cross-checks lego.yaml / sublego.yaml owners against them. They are
#                 NOT runtime identities, NOT worker slots, and carry no assignment or merge authority
#                 (runtime_authority: false). Work is assigned by the Manager through the control plane.

worker_slots_authority: docs/engineering-operations/workforce/policy.json#workerSlots
worker_slots:
  - id: AGENT-01
    persistent_branch: arena/agent-01
    default_workspace: /srv/arena/workspaces/AGENT-01
    ownership: none
  - id: AGENT-02
    persistent_branch: arena/agent-02
    default_workspace: /srv/arena/workspaces/AGENT-02
    ownership: none
  - id: AGENT-03
    persistent_branch: arena/agent-03
    default_workspace: /srv/arena/workspaces/AGENT-03
    ownership: none
  - id: AGENT-04
    persistent_branch: arena/agent-04
    default_workspace: /srv/arena/workspaces/AGENT-04
    ownership: none
  - id: AGENT-05
    persistent_branch: arena/agent-05
    default_workspace: /srv/arena/workspaces/AGENT-05
    ownership: none
  - id: AGENT-06
    persistent_branch: arena/agent-06
    default_workspace: /srv/arena/workspaces/AGENT-06
    ownership: none
  - id: AGENT-07
    persistent_branch: arena/agent-07
    default_workspace: /srv/arena/workspaces/AGENT-07
    ownership: none
  - id: AGENT-08
    persistent_branch: arena/agent-08
    default_workspace: /srv/arena/workspaces/AGENT-08
    ownership: none
  - id: AGENT-09
    persistent_branch: arena/agent-09
    default_workspace: /srv/arena/workspaces/AGENT-09
    ownership: none
  - id: AGENT-10
    persistent_branch: arena/agent-10
    default_workspace: /srv/arena/workspaces/AGENT-10
    ownership: none

# Legacy ownership records (sublego-audit only; runtime_authority: false).
agents:
  - id: agent-01
    name: "Agent 01 (Workflow Core & Graph Engine)"
    primary_lego: workflow
    allowed_sublegos:
      - workflow.graph
      - workflow.traversal
      - workflow.diff
      - trigger.lifecycle
    workspace: "/srv/arena/workspaces/agent-01"
    runtime_authority: false

  - id: agent-02
    name: "Agent 02 (Node Model & Native Executors)"
    primary_lego: node
    allowed_sublegos:
      - node.model
      - node.parameters
      - node.native_executor
      - credentials.resolver
    workspace: "/srv/arena/workspaces/agent-02"
    runtime_authority: false

  - id: agent-03
    name: "Agent 03 (Connection & Routing Engine)"
    primary_lego: connection
    allowed_sublegos:
      - connection.graph
      - connection.router
      - webhook.router
      - scheduler.engine
    workspace: "/srv/arena/workspaces/agent-03"
    runtime_authority: false

  - id: agent-04
    name: "Agent 04 (Expression & Data Plane Engine)"
    primary_lego: expression
    allowed_sublegos:
      - expression.compiler
      - expression.evaluator
      - execution_data.buffer
    workspace: "/srv/arena/workspaces/agent-04"
    runtime_authority: false

  - id: agent-05
    name: "Agent 05 (Validation & Integration Guardian)"
    primary_lego: validation
    allowed_sublegos:
      - validation.cycle
      - validation.uniqueness
      - validation.dangling
      - persistence.snapshot
      - api.envelope
      - integration.gates
    workspace: "/srv/arena/workspaces/agent-05"
    runtime_authority: false

  - id: agent-manager
    name: "Arena Manager (Delegated Technical Operator)"
    primary_lego: manager
    allowed_sublegos:
      - manager.control
    workspace: "/srv/arena/workspaces/agent-manager"
    runtime_authority: false

