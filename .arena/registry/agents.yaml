agents:
  - id: agent-01
    name: "Agent 01 (Workflow Core & Graph Engine)"
    primary_lego: workflow
    allowed_sublegos:
      - workflow.graph
      - workflow.traversal
      - workflow.diff
      - trigger.lifecycle
    workspace: "/srv/arena/workspaces/agent-01"
    status: idle

  - id: agent-02
    name: "Agent 02 (Node Model & Native Executors)"
    primary_lego: node
    allowed_sublegos:
      - node.model
      - node.parameters
      - node.native_executor
      - credentials.resolver
    workspace: "/srv/arena/workspaces/agent-02"
    status: idle

  - id: agent-03
    name: "Agent 03 (Connection & Routing Engine)"
    primary_lego: connection
    allowed_sublegos:
      - connection.graph
      - connection.router
      - webhook.router
      - scheduler.engine
    workspace: "/srv/arena/workspaces/agent-03"
    status: idle

  - id: agent-04
    name: "Agent 04 (Expression & Data Plane Engine)"
    primary_lego: expression
    allowed_sublegos:
      - expression.compiler
      - expression.evaluator
      - execution_data.buffer
    workspace: "/srv/arena/workspaces/agent-04"
    status: idle

  - id: agent-05
    name: "Agent 05 (Validation & Integration Guardian)"
    primary_lego: validation
    allowed_sublegos:
      - validation.cycle
      - validation.uniqueness
      - validation.dangling
      - persistence.snapshot
      - api.envelope
      - integration.gates
    workspace: "/srv/arena/workspaces/agent-05"
    status: idle
