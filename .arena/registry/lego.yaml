  - id: scheduler
    name: Workflow Timer & Cron Scheduler
    status: active
    contract: contracts/scheduler.contract.md
    owner: agent-03
    current_implementation: reference
    available_implementations: [reference, rust]
    allowed_paths: [crates/n8n-workflow/src/**]
    forbidden_paths: [reference/n8n/**]
    dependencies: [workflow]
