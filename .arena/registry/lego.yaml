  - id: api
    name: REST & GraphQL Control Plane API
    status: active
    contract: contracts/api.contract.md
    owner: agent-05
    current_implementation: reference
    available_implementations: [reference, rust]
    allowed_paths: [crates/n8n-common/**]
    forbidden_paths: [reference/n8n/**]
