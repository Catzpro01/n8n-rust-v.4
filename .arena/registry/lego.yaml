  - id: manager
    name: Arena Manager & Orchestration Control
    status: active
    contract: contracts/workflow.contract.md
    owner: agent-manager
    current_implementation: rust
    available_implementations: [rust]
    allowed_paths: [crates/**, .arena/**, packages/**]
    forbidden_paths: [reference/n8n/**]
    dependencies: []
    public_inputs: []
    public_outputs: []
