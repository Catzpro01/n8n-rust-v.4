legos:
  - id: workflow
    name: Workflow Core DAG
    status: active
    contract: contracts/workflow.contract.md
    owner: agent-01
    current_implementation: rust
    available_implementations:
      - reference
      - rust
    allowed_paths:
      - crates/n8n-workflow/**
      - packages/workflow-lego/**
    forbidden_paths:
      - reference/n8n/**
      - crates/n8n-nodes-rust/**
    dependencies:
      - node
      - connection
    public_inputs:
      - workflow_json
      - pin_data
    public_outputs:
      - execution_graph
      - checksum
    tests:
      - cargo test -p n8n-workflow
    migration_status: RUST_KERNEL_READY

  - id: node
    name: Node Model & Native Nodes
    status: active
    contract: contracts/node.contract.md
    owner: agent-02
    current_implementation: rust
    available_implementations:
      - reference
      - rust
    allowed_paths:
      - crates/n8n-node-model/**
      - crates/n8n-nodes-rust/**
    forbidden_paths:
      - reference/n8n/**
      - crates/n8n-workflow/**
    dependencies:
      - common
    public_inputs:
      - item_buffer
      - node_parameters
    public_outputs:
      - item_buffer
    tests:
      - cargo test -p n8n-nodes-rust
      - cargo test -p n8n-node-model
    migration_status: RUST_PROTOTYPED

  - id: connection
    name: Connection & Pin Mapping
    status: active
    contract: contracts/connection.contract.md
    owner: agent-03
    current_implementation: rust
    available_implementations:
      - reference
      - rust
    allowed_paths:
      - crates/n8n-connection/**
    forbidden_paths:
      - reference/n8n/**
    dependencies:
      - common
    public_inputs:
      - raw_connections_map
    public_outputs:
      - destination_inverted_map
      - connected_node_list
    tests:
      - cargo test -p n8n-connection
    migration_status: RUST_VERIFIED

  - id: validation
    name: Graph & Schema Validation
    status: active
    contract: contracts/validation.contract.md
    owner: agent-05
    current_implementation: rust
    available_implementations:
      - reference
      - rust
    allowed_paths:
      - crates/n8n-validation/**
    forbidden_paths:
      - reference/n8n/**
    dependencies:
      - workflow
      - node
    public_inputs:
      - workflow_definition
    public_outputs:
      - validation_report
    tests:
      - cargo test -p n8n-validation
    migration_status: RUST_VERIFIED

  - id: execution_data
    name: Execution Data Plane & ItemBuffer
    status: active
    contract: contracts/execution-data.contract.md
    owner: agent-04
    current_implementation: rust
    available_implementations:
      - reference
      - rust
    allowed_paths:
      - crates/n8n-execution-data/**
    forbidden_paths:
      - reference/n8n/**
    dependencies:
      - common
    public_inputs:
      - raw_items
    public_outputs:
      - zero_copy_item_buffer
    tests:
      - cargo test -p n8n-execution-data
    migration_status: RUST_VERIFIED

  - id: expression
    name: Expression Engine
    status: active
    contract: contracts/expression.contract.md
    owner: agent-04
    current_implementation: rust
    available_implementations:
      - reference
      - rust
    allowed_paths:
      - crates/n8n-expression/**
    forbidden_paths:
      - reference/n8n/**
    dependencies:
      - common
    public_inputs:
      - expression_string
      - data_context
    public_outputs:
      - resolved_value
    tests:
      - cargo test -p n8n-expression
    migration_status: RUST_INITIALIZED
