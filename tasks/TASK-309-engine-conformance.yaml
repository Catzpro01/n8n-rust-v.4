operations:
  - name: read_reference
    args: { what: "WorkflowExecute.run / addNodeToBeExecuted / error path / waiting-release" }
  - name: rewrite_engine
    args:
      file: packages/reconstructed-engine/runner.mjs
      added:
        - "mapConnectionsByDestination (1:1 port) + connectionsByDestinationNode"
        - "fan-in waiting: a node with >1 input slot runs ONCE with all inputs"
        - "release pass for waiting nodes whose inputs will never arrive ([] substitute)"
        - "error path: taskData.error + executionStatus 'error', run stops with status 'error'"
        - "continueOnFail / onError=continueRegularOutput|continueErrorOutput pass the INPUT through"
        - "missing destination node throws ApplicationError('Destination node not found')"
        - "an output that produced no items does not run its branch"
        - "v1 top-left-first sort of the nodes to add; v0 FIFO"
        - "result in the n8n shape: resultData.{runData,lastNodeExecuted,error}, status ∈ ExecutionStatus"
      kept: "cycle safety net (n8n relies on the Validation LEGO to reject cycles)"
  - name: add_equivalence_suite
    args:
      file: packages/reconstructed-engine/test/reference-equivalence.test.mjs
      against: "real WorkflowExecute from the pinned n8n-core 2.9.1"
      compares: "execution order, runs per node, item counts, error flag"
      skips_when: "the pinned runtime is not installed"
  - name: wire_gate
    args: { file: tests/integration/run_gate.sh, stage: 3 }

verification:
  unit_suite: "npm run engine:test -> 22 tests, 22 pass, 0 fail, 0 skipped, exit 0"
  equivalence: "reference order == reconstructed order, e.g. [Manual Trigger, Upper, NoOp Upper, Lower, NoOp Lower] on both sides"
  gate_wiring_negative_test: "temp failing test -> run_gate.sh exit 1, 'OFFLINE STAGES : FAIL'; removed -> PASS"
  lego_gate: "npm run verify -> 11/11 PASS, BEHAVIOR CHANGE: NONE DETECTED"
  offline_gate: "contract_conformance 21/21, boundary_audit PASS, engine suite 22/22"
  legacy_script: "node packages/reconstructed-engine/test-run.mjs -> exit 0 (status is now 'success', not 'COMPLETED')"

breaking_changes:
  - "result.status is an n8n ExecutionStatus ('success' | 'error') instead of 'COMPLETED'"
  - "a connection to a node missing from the graph now rejects (n8n behaviour) instead of being ignored"
  - "a handler that throws no longer rejects the promise; the error is recorded and the run ends with status 'error'"

merge_condition:
  - engine_suite_pass
  - equivalence_pass
  - no_reference_change
  - no_ui_change
