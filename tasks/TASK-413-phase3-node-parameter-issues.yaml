acceptance:
  - `validateFieldType` reproduces the reference for every supported type: the `options`
    whitelist message lists the allowed values, `strict` refuses conversions, `parseStrings`
    only affects `string`, `null`/`undefined` are always valid, unknown types pass through, and
    `Number('')` stays `0` (empty string valid, empty string invalid for `boolean`)
  - date-times follow the reference cascade (factory → JSDate → ISO → HTTP → RFC2822 → SQL →
    millis) through an injected factory; the invalid-date message keeps the reference's
    luxon hint verbatim (DELTA-04)
  - `jsonParse` tries strict JSON first, then the injected/relaxed object recovery, then
    `fallbackValue`/`errorMessage` — and the recovery adapter is injectable (DELTA-05)
  - `validateFilterParameter` reproduces the pinned dead-code quirk (always `{}`) and
    `FilterError` keeps `name === 'Error'`, `level === 'warning'`, `description` (DELTA-03)
  - the issues engine matches the reference on every fixture: required-parameter messages,
    disabled/pin-data short-circuit, display gating, resource-locator regex + `=` skip +
    unknown mode, resource-mapper (incl. `mode !== 'add'` skipping required checks and the
    empty `parameters[<name>]` artefact), filter parameters, `validateType`, collection and
    fixedCollection children (min/max wording, per-item iteration, leaf-name issue keys)
  - `mergeIssues` merges only `parameters`/`credentials`/`execution`/`typeUnknown`;
    `getContext` creates context objects lazily and raises the three reference errors
  - differential vs the published `n8n-workflow@2.9.1` build: **0 divergences** across ≥1400
    comparisons (N19 624, N20 392, N21 12, N22 58 new) with the falsifiability probe re-run
    (each injected mutation must produce a DIVERGE)
  - gate `N01`…`N07` PASS; `npm run verify:all` exit 0; conformance 42/42; boundary PASS
  - no file under reference/, crates/, apps/, the frontend or a peer package is touched

