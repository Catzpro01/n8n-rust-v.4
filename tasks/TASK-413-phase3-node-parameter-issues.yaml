status: VERIFIED

# Context: TASK-409/411 made the Node Model runnable, but the *validation* half was still
# pinned-out (contract §12.2): nothing could answer "is this node configured correctly?".
# This task closes that gap — the surface the editor's issue badges and the workflow
# validation pass consume — plus the two support modules it needs (field-type validation and
# filter-parameter validation). Everything is differentially compared against the published
# `n8n-workflow@2.9.1` build, including the 624-case `validateFieldType` matrix.
#
# Reference (read-only, line-cited in the module docblocks):
# - reference/n8n/packages/workflow/src/type-validation.ts (whole file, 481 ln)
# - reference/n8n/packages/workflow/src/utils.ts jsonParse L152 + parseJSObject L123
# - reference/n8n/packages/workflow/src/type-guards.ts isBinaryValue L168,
#   isValidResourceLocatorParameterValue L47
# - reference/n8n/packages/workflow/src/node-parameters/filter-parameter.ts L23-450
#   (VALIDATION half; the execution half is explicitly out of scope)
# - reference/n8n/packages/workflow/src/node-helpers.ts getContext L505-538,
#   getNodeParametersIssues L1202-1225, validateResourceLocatorParameter L1228-1255,
#   validateResourceMapperParameter L1257-1303, validateParameter L1305-1323,
#   addToIssuesIfMissing L1325-1358, getParameterIssues L1389-1580, mergeIssues L1600-1635
# - Oracles: test/type-validation.test.ts (512 ln), test/filter-parameter.test.ts,
#   test/node-helpers.test.ts describe('getParameterIssues') L3683 +
#   describe('getParameterIssues, required parameters validation') L4270
#
# Sanctioned deltas added by this task (contract §12.2):
# - DELTA-04: no `luxon` — date-times go through an injected `dateTimeFactory`; the built-in
#   factory understands Date/ISO-8601/HTTP-date/RFC-2822/SQL. The differential injects the
#   reference's own luxon so the cascade is compared bit-for-bit.
# - DELTA-05: no `esprima`/`jsonrepair` — `jsonParse`'s recovery paths are injected adapters
#   (default: relaxed-JS-object normaliser), so `tryToParseObject`/`tryToParseJsonToFormFields`
#   stay dependency-free.

