phase: 2

# Eighth self-assigned task of this session (STANDING-WORKER-PROTOCOL §2 non-blocking).
# dynamic_task_pool still unreachable (Supabase -> curl HTTP 000; api.github.com -> 200), so no
# pool read and no vote — recorded here rather than skipped silently.

trigger: >
  contracts/execution-engine.contract.md §7 listed `waitTill` resume as a non-goal, and the engine
  had no way to park or resume an execution — so a workflow containing a Wait node could not run in
  the reconstruction at all. While reading the pause path two further gaps turned up: disabled nodes
  were being executed (the reference does not execute them at all), and `findStartNode` could pick a
  disabled node as the start.

allowed_paths:
  - packages/reconstructed-engine/**
  - contracts/execution-engine.contract.md
  - tasks/TASK-314-engine-wait-resume.yaml
  - results/TASK-314-engine-wait-resume.md
  - docs/isolation/evidence/**        # rewritten by npm run verify, tracked by design

forbidden_paths:
  - reference/n8n/**                  # read-only; gate G04 re-verifies 15050 files
  - crates/**
  - apps/**
  - packages/workflow-lego/src/**
  - packages/editor-ui/**             # rule 5: the UI stays untouched

operations:
  - name: port_pause
    args:
      reference: "base-execute-context.ts:107-112, workflow-execute.ts:1821, :1948-1959, :2391-2396, :2435-2436"
      detail: >
        the handler context gains putExecutionToWait(date); the parked node's taskData gets
        executionStatus 'waiting', goes back on the stack, the loop stops, the run status becomes
        'waiting' and the result carries waitTill.
  - name: port_resume
    args:
      reference: "workflow-execute.ts:1285-1302, :1400-1412, :105-108"
      new_methods: [handleWaitingState, processRunExecutionData]
      new_constructor_arg: runExecutionData
      detail: >
        resuming clears waitTill, marks the parked node disabled and pops its waiting runData entry;
        the result's runExecutionData is the persistable snapshot (IRunExecutionData shape,
        run-execution-data-factory.ts:54-89, trimmed to the fields this engine maintains).
  - name: port_disabled_node
    args:
      reference: "workflow-execute.ts:909-920, :1199-1201"
      detail: "a disabled node is never executed — its first main input is passed through"
  - name: port_null_output
    args:
      reference: "workflow-execute.ts:1769-1774"
      detail: "no output object at all -> no runData entry and the branch ends (unless errored or parked)"
  - name: fix_start_node_selection
    args:
      reference: "workflow.ts:824, :839, :853"
      change: "findStartNode skips disabled nodes"
  - name: extend_contract
    args:
      guarantees: [G19, G20, G21, G22]
      surface: "+handleWaitingState, +processRunExecutionData, +instance field runExecutionData"
      result: "+paused, +waitTill, +runExecutionData, status +'waiting'"
      nongoals: "waitTill removed from §7 (the conformance test forced the correction)"

