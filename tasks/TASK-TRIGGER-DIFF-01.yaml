# concurrently (packages/trigger-lego from TASK-406, packages/execution-engine
# activation surface from TASK-ENGINE-ACTIVATION-01) and prescribes the cheap way
# to decide: "run both implementations over identical scenarios; any divergence
# found is a bug in one of them and should be fixed failing-first." This task
# executes exactly that, with the same informational-harness conventions as
# TASK-ENGINE-DIFF-01/02 (exit 0 with findings; exit 1 only if the harness broke).
#
# Oracle: reference/n8n/packages/core/src/execution-engine/active-workflows.ts,
# scheduled-task-manager.ts (L52-161), reference/n8n/packages/workflow/src/cron.ts
# (toCronExpression L52-72), workflow.ts queryNodes L272-293 (disabled skip).
# Injected transports (logger/errorReporter/onDuplicate/timer) are compared as
# signal-presence, not transport shape — the reference's exact transports depend
# on instanceSettings, which both dependency-free packages legitimately abstract
# (documented boundary in execution-engine/src/active-workflows.mjs header).

