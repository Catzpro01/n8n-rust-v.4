defects_found_and_fixed:
  - id: defect_1
    what: "UserError and ApplicationError both set `this.name` to the class name"
    reference: >
      Neither `errors/base/base.error.ts` nor `@n8n/errors/src/application.error.ts` assigns
      `this.name`. Both therefore report the inherited `name === 'Error'`; only `constructor.name`
      carries the class name.
    how_found: >
      The new differential compares `error.name` against the published build. Six comparisons
      diverged — `mine: "ApplicationError"` vs `theirs: "Error"` — across the three fixture cases.
      Hand-written expectations would not have caught this: `tests/reference/workflow-rust/
      fixtures.json` records `errorName: error.constructor?.name` (build-fixtures.mjs:255), which
      is unaffected, so all 61 tests were green before the fix.
    also_fixed: >
      `UserError` was missing `shouldReport`, `tags` and `extra`, and defaulted `level` to
      `undefined` instead of `'info'` (which is what makes `shouldReport` false).
    verified: >
      Field-for-field equality with the published build:
      `name="Error" ctor=UserError level="info" shouldReport=false` on both sides.

