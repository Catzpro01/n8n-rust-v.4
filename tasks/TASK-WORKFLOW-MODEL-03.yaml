notes:
  - "The aggregate is now complete: `comm` over the reference's 27 method declarations and the reconstruction's reports an empty difference set. Before this task six were missing: getStaticData, setTestStaticData, getTriggerNodes, getPollNodes, queryNodes, getConnectionsBetweenNodes."
  - "Reference quirks reproduced, not fixed: getStaticData's test-data short-circuit is truthiness not presence, and its lazily created bucket is an ObservableObject parented to staticData so writes mark the workflow dirty; queryNodes skips `disabled === true` BEFORE the type lookup, so a disabled trigger is never offered to checkFunction; getConnectionsBetweenNodes walks Object.keys of both the type map and each branch array (so order is key-insertion order, keys are re-parsed with parseInt), returns the stored destination object BY IDENTITY not a copy, and skips null sparse slots."
  - "One documented substitution: the reference error constructors derive `tags.packageName` from `callsites()[2].getFileName()`. That needs the `callsites` package and reads the caller's path, so it is not reproduced; no fixture or differential observes it."
  - "Hygiene: docs/isolation/LEGO-MASTER-MAP.md had three copies of the TASK-WORKFLOW-MODEL-01 row and two of TASK-409, plus one line with two table rows glued together — an artefact of the keep-both merge resolver used while pushing TASK-02. The glued row was split and superseded duplicates dropped; the pool table now has 18 rows with every task id exactly once."

