acceptance:
  - `sleep(ms)` resolves after `ms` through the `setUtilsTimerFns` seam (globals by default, so the
    default behaviour is the reference's own `setTimeout`)
  - `sleepWithAbort(ms, signal)` resolves without a signal, rejects immediately with
    `ManualExecutionCancelledError` when the signal is already aborted (without scheduling a
    timer) and rejects + `clearTimeout`s when aborted mid-sleep; the error carries
    `message 'The execution was cancelled manually'`, `level 'warning'`, `reason 'manual'`,
    `extra { executionId: '' }` and the reference's own-key order
  - `updateDisplayOptions(options, properties)` folds the options into every property with the
    reference's `merge({}, nodeProperty.displayOptions, displayOptions)` semantics (arrays merge by
    index, nested objects merge, inputs not mutated)
  - the DELTA-01 `merge` subset matches the reference build's bundled `lodash/merge` on the corpus
    (arrays by index, `undefined` never overwrites, `keysIn` sources, `__proto__` skipped,
    non-plain objects by reference, cycles, shared references) — corpus differential run
  - gate `N08` reports **0 deferred** (all 120 boundary symbols classified) and gate `N07` all
    **125** exported symbols documented
  - suite 136 -> **145 tests / 0 fail / 0 cancelled**; differential 1797 -> **1822 agree / 0
    diverge** (29 groups); `npm run verify:all` exit 0
  - falsifiability: array-concatenating `merge`, a generic `Error` on abort, a shallow-spread
    `updateDisplayOptions`, a removed export, and a hanging test each fail the harness/gate they
    should; all mutations reverted byte-identical
  - no file under reference/, crates/, apps/, the frontend or a peer package is touched

