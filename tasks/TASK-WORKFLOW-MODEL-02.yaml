notes:
  - "The frozen Workflow surface of contracts/workflow.contract.md §6 is now fully reconstructed on the JS/TS track: no member remains unimplemented."
  - "Reference quirks reproduced, not fixed: getHighestNode pushes self only when disabled === false and early-returns currentHighest when there is no incoming main edge; searchNodesBFS is level-synchronous and excludes the source from its own result while still marking it visited; getParentMainInputNode sorts twice for determinism and throws ApplicationError on a missing resolved child; getNodeConnectionIndexes reports the loop index, not the recorded index; __getStartNode stages 2 and 3 can never match under the golden harness's stub (node types are node names, never in STARTING_NODE_TYPES), so getStartNode(dest) reduces to nodes[getHighestNode(dest)[0]] — reproduced rather than repaired."
  - "One invocation error of mine is corrected here for the record: tests/reference/harness/run.js filters on suite names (execution-data | expression | connection), not on a JSON path. Passing the fixtures path selects zero suites and prints 0 PASS / 0 FAIL / 0 UNKNOWN, which is not a failure signal."
  - "packages/reconstructed-engine has no package.json by design; it is driven by the root script `npm run reconstructed-engine:test`. `npm --prefix packages/reconstructed-engine test` exits 254 with ENOENT and is not a valid check."

