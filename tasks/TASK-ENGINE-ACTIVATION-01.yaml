acceptance:
  - `TriggersAndPollers.runTrigger` reproduces the reference oracle:
    ApplicationError when the node type has no trigger, plain call in non-manual mode,
    and in manual mode a `manualTriggerResponse` promise resolved by `emit(data)`,
    rejected by `emitError(error)`, with `sendResponse` / `workflowExecuteAfter` hook
    handlers bound to the optional response/done deferred promises
  - `runPoll` throws when the node type has no poll function and otherwise returns the
    poll result verbatim (null included); poll errors propagate
  - `ActiveWorkflows.add/remove` reproduce the reference: trigger responses collected,
    polling activated after triggers, initial poll test run before cron registration,
    `UserError` for intervals whose first cron field contains `*`, workflow deactivated
    again when polling fails and there are no trigger responses, `TriggerCloseError`
    logged + reported instead of thrown, other close errors wrapped in
    `WorkflowDeactivationError`, `remove()` on an inactive id warns and returns false
  - workflow model gains `queryNodes/getTriggerNodes/getPollNodes` verbatim (disabled
    nodes skipped, unknown node type skipped, declaration order)
  - `ExecutionLifecycleHooks` matches the reference store (8 hook names, addHandler push,
    runHook awaits handlers in order, handlers bound to `this`)
  - `TriggerContext` throws on the un-overwritten emit/emitError/saveFailedExecution,
    exposes `getActivationMode()` and `getCredentials()`, and keeps the base context API
  - gate `E10` covers the new suite; `E08` covers every new exported symbol via the contract
  - suites green: execution 40 + new, gate 10/10, verify:all exit 0, 42/42, boundary PASS
  - no file under reference/, crates/, apps/, frontend or the peer packages is touched

merge_condition:
  - regression_gate_pass
  - no_contract_violation
