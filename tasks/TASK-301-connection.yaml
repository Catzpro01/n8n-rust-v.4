  - name: list_files
    args: { path: reference/n8n/packages/workflow/src/common }
  - name: request_dependency
    args:
      provider: "agent-1"
      provider_lego: "workflow"
      interface: "Workflow::getNode"
      access: "read-only"
      description: "Connection routing (getNodeConnectionIndexes, getStartNode, getParentMainInputNode) lives in workflow.ts and needs node existence lookup by name."
  - name: request_dependency
    args:
      provider: "agent-1"
      provider_lego: "workflow"
      interface: "Workflow::connectionsBySourceNode / connectionsByDestinationNode"
      access: "read-only"
      description: "Both adjacency maps are built and owned by Workflow; connection LEGO defines their shape and the pure functions over them. Note: renameNode does not rebuild connectionsByDestinationNode (observed) — Agent 1 to confirm/track."
  - name: request_dependency
    args:
      provider: "agent-2"
      provider_lego: "node"
      interface: "NodeHelpers::getNodeOutputs / getNodeInputs / getConnectionTypes"
      access: "read-only"
      description: "Declared input/output count per node (incl. onError='continueErrorOutput' extra 'Error' main output) is required to validate connection indexes."
  - name: read_messages
    args:
      since: "eb1c1195"   # origin/main sync: Agent 2 Node LEGO promoted to VERIFIED (21/21 + 11/11 live)
      result: "node.contract.md §6 now specifies getNodeInputs/getNodeOutputs/getConnectionTypes and category:'error' outputs -> D-09 dependency contract-satisfied; CD-05 updated. No reply yet on MSG-02 / D-08 from agent-1."
  - name: send_message
    args:
      to: "agent-5"
      type: STATUS_REPORT
      subject: "ISSUE-007 (agent-3): docs/isolation/connection.md published; TASK-301-connection ready for gate"
      body: "No source modified. Blueprint docs/isolation/connection.md, contract deps CD-01..CD-07 in contracts/connection.contract.md, tests/reference/connection 5/5 (node tests/reference/harness/run.js connection). Request LEGO-MASTER-MAP Connection row BLOCKED -> TESTED."
  - name: respond_dependency
    args:
      to: "agent-1"
      in_reply_to: "MSG-02"
      decision: "Option B for Phase 2 (consume frozen surface as-is), Option A for Phase 3 (Connection owns common/**, graph/**, connections-diff behind port P-CONNECTION-GRAPH)."
      reference: "docs/isolation/connection.md#01-answer-to-msg-02"
  - name: send_message
    args:
      to: "agent-1"
      type: DEFECT_REPORT
      subject: "D-08: Workflow.renameNode does not rebuild connectionsByDestinationNode"
      body: "workflow.ts L456-484 mutates connectionsBySourceNode in place; byDest still holds the old name afterwards (observed on n8n-workflow@2.9.1). Not touched by agent-3; your call whether to re-run mapConnectionsByDestination."

tests:
