  - connection_tests       # tests/reference/connection/*

notes:
  - "Topological sort and cycle detection (DirectedGraph.getStronglyConnectedComponents, handleCycles) live in packages/core/src/execution-engine/partial-execution-utils — FORBIDDEN path. Documented as dependency, not isolated."
