id: TASK-313-engine-error-handling
agent: arena-worker (session arena/01a0aee7-n8n-rust-v-4)
lego: workflow
module: reconstructed-engine
phase: 2

# Seventh self-assigned task of this session (STANDING-WORKER-PROTOCOL §2 non-blocking).
# dynamic_task_pool still unreachable (Supabase -> curl HTTP 000; api.github.com -> 200), so no
# pool read and no vote — recorded here rather than skipped silently.

trigger: >
  contracts/execution-engine.contract.md §7 listed node error handling as partly out of scope and
  runner.mjs had 0 references to retryOnFail while workflow-execute.ts has the full retry budget
  (:1600-1630, :1670-1692), the error-output routing (:1720-1722, :2463-2562) and the inline
  $error merge (:1898-1917). These are the semantics that decide whether a broken workflow stops,
  retries, or routes its failures — i.e. exactly what the UI shows in the execution view.

allowed_paths:
  - packages/reconstructed-engine/**
  - contracts/execution-engine.contract.md
  - tasks/TASK-313-engine-error-handling.yaml
  - results/TASK-313-engine-error-handling.md
  - docs/isolation/evidence/**        # rewritten by npm run verify, tracked by design

forbidden_paths:
  - reference/n8n/**                  # read-only; gate G04 re-verifies 15050 files
  - crates/**
  - apps/**
  - packages/workflow-lego/src/**
  - packages/editor-ui/**             # rule 5: the UI stays untouched

operations:
  - name: port_retry_budget
    args:
      file: packages/reconstructed-engine/runner.mjs
      reference: "workflow-execute.ts:1600-1630 + :1670-1692"
      detail: >
        maxTries = min(5, max(2, node.maxTries || 3)); waitBetweenTries =
        min(5000, max(0, node.waitBetweenTries || 1000)); retry loop resets executionError per
        attempt; a node that returned json.error on its first item is retried with the same budget
        and then counts as a success.
  - name: port_error_output_routing
    args:
      reference: "workflow-execute.ts:1720-1722, :2463-2562 + node-helpers.ts:1140-1196"
      new_methods: [mainOutputCount, handleNodeErrorOutput]
      detail: >
        error items move to the last main output; the error output exists because getNodeOutputs
        appends one when onError === 'continueErrorOutput'; three error-detection rules only;
        enrichment resolves the source item from executionData.data (equivalent to
        $getPairedItem when the destination is the direct parent, workflow-data-proxy.ts:960-985).
  - name: port_inline_error_merge
    args: { reference: "workflow-execute.ts:1898-1917" }
  - name: fix_lastNodeExecuted
    args:
      reference: "workflow-execute.ts:1738-1741"
      change: "`if (nodeSuccessData?.[0]?.[0])` -> `if (nodeSuccessData)`, moved before alwaysOutputData"
      why: "the real engine marks a node that emitted ZERO items as lastNodeExecuted (probe6)"
  - name: distinguish_unknown_node_type
    args:
      change: "registerNodeType no longer stores `{}` when no description is given"
      why: "node-helpers.ts:1146-1148 returns [] for a missing nodeTypeData -> 0 main outputs"
  - name: extend_contract
    args: { guarantees: [G15, G16, G17, G18], amended: [G13] }

verification:
  real_engine_ground_truth:
    tool: "/tmp/probe5.mjs, /tmp/probe6.mjs against n8n-core 2.9.1 (real n8n-nodes-base nodes)"
    retry: "maxTries 2 -> 2 attempts, 3 -> 3, 10 -> 5 (clamped), 1 -> 2 (clamped), absent -> 3"
    wait: "waitBetweenTries 0 or absent -> 1000 ms (3 attempts took 2005 ms); 200 -> 404 ms"
    routing: "Set + onError=continueErrorOutput -> data=[[],[{\"error\":\"soft-boom\"}]], Err branch runs"
    control: "the same node without an error item -> data=[[{\"ok\":1}],[]]"
    inline: "raw item {json:{error:'dollar-boom'},pairedItem:{item:0},error:{message:'dollar-boom'}}"
    thrown: "continueErrorOutput -> status error, input passed to output 0; continueRegularOutput -> status success, After runs"
    lastNodeExecuted: "Limit maxItems 0 -> runData.Lim[0].data.main === [[]] and lastNodeExecuted === 'Lim'"
  engine_suite: "npm run engine:test -> 73 tests, 73 pass, 0 skipped, exit 0 (52 unit + 3 graph + 11 real engine + 7 contract)"
  negative_controls:
    - "retry loop disabled -> not ok 47,48,50,51,70 (incl. the real-engine case), 68/73; restored -> 73/73"
    - "handleNodeErrorOutput call disabled -> not ok 52,53,54,55,72, 68/73; restored -> 73/73"
  drift_caught:
    - "contract test: 2 new methods undeclared in §2, 3 citations to unregistered reference files"
    - "unit test: mainOutputCount returned 1 for an unregistered node type (reference: 0)"
    - "unit test: enrichment needs node-provided pairedItem — the reference routes BEFORE assignPairedItems"
    - "unit test engine.test.mjs:709 asserted lastNodeExecuted stayed on the previous node; the real engine disagrees -> test corrected"
  central_harness: "contract_conformance.mjs -> 22/22 exit 0"
  offline_gate: "run_gate.sh --offline-only -> stages 1-3 PASS (22/22, AUDIT PASS, 73/73), live NOT RUN -> INCONCLUSIVE"
  lego_gate: "npm run verify -> 11/11 PASS, BEHAVIOR CHANGE: NONE DETECTED"
  rust_guard: "npm run rust:guard -> exit 0"
  legacy_demo: "node packages/reconstructed-engine/test-run.mjs -> exit 0"

merge_condition:
  - engine_suite_pass
  - negative_controls_pass
  - no_reference_change
  - no_ui_change
