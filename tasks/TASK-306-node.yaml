  node_subset: 8 files / 532 tests PASS
  typecheck: pnpm --filter n8n-workflow typecheck PASS
  build: pnpm --filter n8n-workflow build PASS (esm+cjs emit node-model/)
  reference_diff: additive-only (packages/workflow/src/node-model/)

