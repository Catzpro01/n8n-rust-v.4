id: TASK-UTILS-01-phase3-utils-surface
agent: arena-worker
lego: node
module: utils
phase: 3
title: "Node LEGO: utils.ts helper surface (17 helpers) + mechanical reference-surface coverage audit (new gate N08) — closes the last unreconstructed utils against test/utils.test.ts, and makes the boundary's scope auditable instead of asserted"
status: VERIFIED

# Context: after TASK-REPAIR-01 the node lane's prose claim ("only workflow validation remains out
# of scope", contract §12.2 item 8) was still *asserted*, not measured — and measuring it found a
# real gap: 18 of the 120 symbols exported by the 17 pinned boundary files were neither ported nor
# classified. Most are the `utils.ts` helpers the Node Model boundary owns, and `test/utils.test.ts`
# already pins them (isObjectEmpty L21-97, jsonStringify L293-315, fileTypeFromMimeType L394-436,
# randomInt L438-454, randomString L456-484, hasKey L485-554, isSafeObjectProperty L555-571,
# setSafeObjectProperty L572-583, isDomainAllowed L649-862, isCommunityPackageName L863-916,
# sanitizeFilename L917+). The published build exports all of them, so they are differentially
# comparable.
#
# Reference (read-only, line-cited in `src/utils.mjs`):
# - reference/n8n/packages/workflow/src/utils.ts L21-511 (17 helpers) and constants.ts L1-4 (ALPHABET)
# - reference/n8n/packages/workflow/test/utils.test.ts (the blocks above)
#
# Sanctioned deltas used here:
# - DELTA-01 (lodash subset): the lodash `isObject` predicate is exported as `lodashIsObject`
#   because the boundary name `isObject` belongs to `utils.ts` L29 (a different predicate).
# - DELTA-06 (injected logger): `replaceCircularReferences`' `LoggerProxy.error` call site and
#   `base64DecodeUTF8`'s console fallback go through `setUtilsLogger` (no-op by default).
#
# Scope decisions recorded by the new coverage manifest (gate `N08`), not silently dropped:
# - out-of-scope: DELTA-02 error hierarchy (BaseError/NodeError/ExecutionBaseError), TS-only types,
#   and guard helpers owned by validation-lego / workflow-lego (`dedupe`, `isAssignmentValue`,
#   `isNodeConnectionType`, `isINodePropertyCollection(List)`, `isINodePropertiesList`).
# - internal: `isValidResourceLocatorParameterValue` (used by parameter-issues.mjs).
# - deferred to TASK-UTILS-02: `sleep`, `sleepWithAbort` (injectable timer + boundary-local
#   ManualExecutionCancelledError) and `updateDisplayOptions` (lodash `merge` subset).

