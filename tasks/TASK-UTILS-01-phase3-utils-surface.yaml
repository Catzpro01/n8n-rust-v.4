acceptance:
  - the 17 ported helpers match the published build call-for-call (`N27`, 12 comparison batches),
    including the exact-value `randomInt`/`randomString` runs under a stubbed
    `crypto.getRandomValues`, the `isObjectEmpty` shape matrix, `isSafeObjectProperty`'s banned
    set, `isDomainAllowed`'s wildcard rules and `sanitizeFilename`'s traversal/null-byte cases
  - the oracle's `utils.test.ts` expectations are ported as regression tests (14 cases), including
    the `Object.keys` spy case and the pinned `isTraversableObject` falsy-passthrough quirk
  - gate `N08` classifies **every** exported symbol of the 17 pinned boundary files (120 symbols)
    as ported / internal / out-of-scope / deferred, fails on unclassified or stale entries and on
    ported symbols missing from `src/index.mjs` or the contract
  - gate `N01`…`N08` PASS (N02 21 source files, N03 136 tests, N05 1797/0, N07 117 symbols);
    `npm run verify:all` exit 0
  - falsifiability: relaxing `isSafeObjectProperty` and dropping the null-byte strip each produce
    a `DIVERGE` in `N27`; removing a ported export from `src/index.mjs` and adding a bogus manifest
    entry each make `N08` fail
  - no file under reference/, crates/, apps/, the frontend or a peer package is touched

merge_condition:
