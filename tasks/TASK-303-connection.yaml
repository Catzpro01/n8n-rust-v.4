      - getParentNodes
      - getConnectedNodes
      - getNodeByName
      - mapConnectionsByDestination
      - buildAdjacencyList
      - parseExtractableSubgraphSelection
      - getRootNodes
      - getLeafNodes
      - hasPath
      - getInputEdges
      - getOutputEdges
    content:
      - compareConnections
  types_only:                                  # stay in shared kernel (P-KERNEL-TYPES), NOT moved
    - IConnection
    - IConnections
    - INodeConnection
    - IConnectionAdjacencyList
    - ExtractableSubgraphData
    - ExtractableErrorResult
    - ConnectionsDiff
    - INodeConnectionsDiff
    - NodeConnectionType
    - NodeConnectionTypes
  evidence_pure_leaf:
    - "graph/graph-utils.ts: single import, `import type {...} from '../interfaces'` (workflow-handoff.md §3.1)"
    - "connections-diff.ts: single type import (deviation D-01 → P-KERNEL-TYPES); only consumer workflow-diff.ts:11"
  NOT_included:
    - "Workflow class traversal members (getNodeConnectionIndexes, getHighestNode, getStartNode, getParentMainInputNode, getParentNodesByDepth, searchNodesBFS) — stay with Agent 1; Connection keeps consuming them (CD-04)"
    - "common/** — MEASURED (agent-3, 2.9.4): workflow.ts L5-9 runtime-imports getConnectedNodes/getChildNodes/getParentNodes/mapConnectionsByDestination (used L147, L581, L595, L612); getNodeByName is barrel-only (index.ts:8). All 5 files import only ../interfaces (NodeConnectionTypes value + types) and each other — they are pure leaves too, BUT Workflow depends on them at runtime, so moving them is a Workflow port change (Agent 1), not a free re-export. Kept OUT of this unit; candidate for a later P-CONNECTION-TRAVERSAL port once P-CONNECTION-GRAPH lands."
    - "Topological sort / SCC (core partial-execution-utils) — FORBIDDEN path, D-10 remains a documented dependency"

