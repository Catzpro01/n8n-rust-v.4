verified_facts:
  # Each of these was checked on the tree, not assumed. Re-verify if the tree has moved.
  - "reference declares the property at `reference/n8n/packages/workflow/src/workflow.ts:72` — `expression: Expression;`"
  - "reference imports it at `workflow.ts:20` — `import { Expression } from './expression';`"
  - "reference assigns it at `workflow.ts:134` — `this.expression = new Expression(this);` — and that is the **last** statement of the constructor, immediately after `this.timezone = …` (L132). Nothing else in `workflow.ts` reads `this.expression`; the only other `expression` hit (L422) is a comment in `renameNode`."
  - "reference `Expression` constructor: `reference/n8n/packages/workflow/src/expression.ts:181` — `constructor(private readonly workflow: Workflow) {}`. It takes the aggregate itself."
  - "the Expression LEGO already exports it: `packages/expression-lego/src/expression.mjs:186` — `export class Expression`. That package has **no `index.mjs`**; `expression.mjs` is the entry to require."
  - "CJS `require('../../expression-lego/src/expression.mjs')` succeeds on this Node (v22.22.3) and yields `{ Expression, createEmptyRunExecutionData, evaluateExpression, getGlobalState, hasExpressionExtension, isExpression, … }` — same ESM-from-CJS mechanism `src/node-port.ts` already uses for `packages/node-lego`."

design_decision_required: >
  `packages/expression-lego/src/expression.mjs` imports `luxon` at top level (line 28), and the
  package declares `jmespath` + `luxon` as **runtime dependencies** — unlike `packages/node-lego`,
  which is dependency-free. `node_modules` is gitignored, so on a freshly cloned sandbox the
  require will fail. Eager assignment (what the reference does) would then make **every** Workflow
  construction throw, which would turn the currently green 61-test suite red on a bare clone and
  break `verify:all`. Pick one and document it:

  option_a: >
    Eager, reference-faithful: `this.expression = new Expression(this)` at the same position.
    Most faithful; requires `npm install --prefix packages/expression-lego` to become a documented
    prerequisite of `workflow-model-lego:test` (the way `packages/workflow-lego`'s `n8n-workflow`
    devDependency already is for the N05 differential). Risk: red `verify:all` on a bare clone
    unless the prerequisite is enforced in the gate.
  option_b: >
    Lazy getter: resolve on first access. Construction never fails, but `expression` stops being
    an own data property — observable through `Object.keys`, `hasOwnProperty` and
    `JSON.stringify`/`toJSON`, so this **changes** an already-verified surface (the 6 `toJSON`
    fixtures). Would need those fixtures re-checked.
  option_c: >
    Eager with an explicit, loud failure: construct when the port resolves, throw a clear error
    naming the missing prerequisite when it does not. Faithful where it matters, and never
    silently diverges. Recommended unless the prerequisite cannot be enforced.

  Whichever is chosen: do **not** let a missing port silently produce `expression === undefined`.
  That is the exact failure mode ISSUE-027 was about.

