id: TASK-W2-PACKAGING
worker: worker-02
title: "Worker 2: Runtime Packaging & Operational Scripts"
scope: "deploy/docker/**, scripts/*.sh, .env.example"

allowed_paths:
  - deploy/docker/**
  - scripts/install.sh
  - scripts/start.sh
  - scripts/stop.sh
  - scripts/upgrade.sh
  - scripts/rollback.sh
  - scripts/doctor.sh
  - .env.example

forbidden_paths:
  - apps/**
  - tests/**
  - packages/**
  - crates/**
  - reference/**

requires:
  - contracts/ts-runtime.contract.md

deliverables:
  - deploy/docker/Dockerfile
  - deploy/docker/compose.yaml
  - .env.example
  - scripts/install.sh
  - scripts/start.sh
  - scripts/stop.sh
  - scripts/upgrade.sh
  - scripts/rollback.sh
  - scripts/doctor.sh

merge_conditions:
  - clean_install_succeeds
  - daemon_start_stop_succeeds
  - doctor_probe_succeeds
  - boundary_enforced
