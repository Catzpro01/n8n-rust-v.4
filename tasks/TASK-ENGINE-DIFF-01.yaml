  - every AGREE/DIVERGE verdict carries the compared values
  - reference-backed expectations cite verified source lines only
    (finished-flag L2438, R5 routing L1843-1860+L1985-2017, R1-R7 rules)
  - ISSUE-021 addendum is append-only, dated, and signed
  - verify:all + 42/42 + boundary stay green; engines' own suites untouched
  - results file has a non-empty operations table (Stage 2c T1 clean)
  - no file under reference/, crates/, apps/, frontend, contracts/,
    or either engine package touched

merge_condition:
  - regression_gate_pass
  - no_contract_violation
