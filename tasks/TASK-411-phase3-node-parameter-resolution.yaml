title: "Node LEGO: parameter resolution — getNodeParameters, dependency ordering, utils.deepCopy, isExpression and the ApplicationError surface (ref: node-helpers.ts L542-1056, utils.ts L53-87, expressions/expression-helpers.ts L1-10, @n8n/errors application.error.ts)"
status: VERIFIED

# Context: TASK-409 landed the Node Model helper surface but deliberately left the
# parameter-ISSUES engine and the parameter RESOLVER out (contract §12.2). `getNodeParameters`
# is the single most-used NodeHelpers entry point — the editor renders every node with it and
# the workflow-validation path resolves defaults through it — and it was still only reachable
# through the pinned reference tree. This task reconstructs it (plus everything it needs that
# was still missing: `utils.deepCopy`, `isExpression` and the `@n8n/errors` ApplicationError
# the resolve-order guard throws).
#
# Reference (read-only, line-cited in the module docblocks):
# - reference/n8n/packages/workflow/src/node-helpers.ts L542-575 (getParameterDependencies),
#   L577-656 (getParameterResolveOrder + max-iterations guard), L592-598 (GetNodeParametersOptions),
#   L658-1056 (getNodeParameters)
# - reference/n8n/packages/workflow/src/utils.ts L53-87 (deepCopy — the copy the Node Model uses;
#   NOT lodash cloneDeep, which the reference does not import here)
# - reference/n8n/packages/workflow/src/expressions/expression-helpers.ts L1-10 (isExpression)
# - reference/n8n/packages/@n8n/errors/src/application.error.ts (ApplicationError: never sets `name`)
# - Oracle: test/node-helpers.test.ts `describe('getNodeParameters')` L34-3466 (the
#   noneDisplayed × returnDefaults output matrix) and
#   `describe('getNodeParameters - noDataExpression handling')` L6321-6524
# - Differential target: the published `n8n-workflow@2.9.1` build (declared devDependency of
#   `packages/workflow-lego`), scenario groups N16, N17, N18

