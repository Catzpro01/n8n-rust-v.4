acceptance:
  - `getNodeParameters` reproduces the reference's four-way behaviour contract:
    `returnDefaults` adds defaults, `returnNoneDisplayed` keeps parameters whose
    `displayOptions` do not match, the display-check pass runs first unless the caller passes
    `dataIsResolved`, and `onlySimpleTypes` stops at the top level
  - the documented quirks are reproduced bug-for-bug and covered by the differential:
    `boolean`/`number`/`options` keep `false`/`0`; `resourceLocator` defaults become
    `{ __rl: true, … }`; duplicate parameter names are re-checked individually; `noDataExpression`
    strips the leading `=` only on the `returnDefaults` path; a collection never materialises
    child defaults without values; a fixedCollection that only holds default values is preserved
    while one holding hidden non-default values is dropped; an empty single-value fixedCollection
    returns the input values unchanged; a non-array fixedCollection element is iterated with
    `for…of`
  - dependency ordering is reproduced, including the pinned cycle behaviour (the
    unresolved-dependency `continue` only advances the dependency loop, so cycles terminate with
    both parameters resolved) and the `ApplicationError('Could not resolve parameter
    dependencies. Max iterations reached!…')` guard
  - `deepCopy` reproduces `utils.ts` verbatim: primitives/functions returned as-is,
    `toJSON`-first (a `Date` becomes its ISO string), cycle-safe through the `WeakMap`,
    plain-object clones; `getNodeOutputs` now uses it instead of lodash `cloneDeep`
  - `isExpression` reproduces the predicate; `ApplicationError` reproduces the reference surface
    including the quirk that `name` stays `'Error'` while `level` defaults to `'error'`
  - differential vs the published `n8n-workflow@2.9.1` build: **0 divergences** across ≥300
    comparisons (N16 56, N17 11, N18 9 new), with the falsifiability probe re-run
  - gate `N01`…`N07` PASS; `verify:all` exit 0; conformance 42/42; boundary PASS
  - no file under reference/, crates/, apps/, frontend or the peer packages is touched

