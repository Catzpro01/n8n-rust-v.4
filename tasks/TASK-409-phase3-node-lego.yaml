id: TASK-409-phase3-node-lego
agent: arena-worker
lego: node
module: node-model-helpers
phase: 3
title: "Node LEGO: Node Model pure-function surface — NodeHelpers (connection IO, display conditions, naming/tool helpers), node-validation.ts, node-parameters/* (ref: node-helpers.ts, node-validation.ts, path-utils.ts, rename-node-utils.ts, node-parameter-value-type-guard.ts, parameter-type-validation.ts)"
status: SUBMITTED_FOR_REVIEW

# Context: Phase 2 isolated the Node Model (`docs/isolation/node.md`, `contracts/node.contract.md`)
# and proved the boundary — `packages/workflow-lego` *ports* it (`src/ports/node-model.ts`) and
# `packages/execution-engine` consumes `nodeType.*` at run time — but no package RAN the model:
# every Node-Model helper was still only reachable through the pinned reference tree. This task
# makes that surface executable as a dependency-free JavaScript LEGO and diffs it against the
# published reference build, so the Workflow/Execution LEGOs have a concrete provider to wire.
#
# Reference (read-only, line-cited in the module docblocks):
# - reference/n8n/packages/workflow/src/node-helpers.ts (1966 ln)
# - reference/n8n/packages/workflow/src/node-validation.ts (88 ln)
# - reference/n8n/packages/workflow/src/node-parameters/{path-utils.ts 24 ln, rename-node-utils.ts 29 ln,
#   node-parameter-value-type-guard.ts 127 ln, parameter-type-validation.ts 272 ln}
# - reference/n8n/packages/workflow/src/type-guards.ts (guards composed by the value guard)
# - reference/n8n/packages/workflow/src/errors/{node-operation.error.ts, abstract/node.error.ts,
#   abstract/execution-base.error.ts}
# - Oracle tests: test/node-helpers.test.ts (6528 ln), test/node-helpers.conditions.test.ts (2208 ln),
#   test/node-validation.test.ts (371 ln), test/node-parameters/*.test.ts (1016 ln),
#   test/rename-node-utils.test.ts
# - Differential target: published `n8n-workflow@2.9.1` build (declared devDependency of
#   `packages/workflow-lego`) — the version the pinned reference commit ships.

