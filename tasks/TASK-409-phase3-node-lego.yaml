acceptance:
  - `getConnectionTypes` / `getNodeInputs` / `getNodeOutputs` / `isSubNodeType` / `isTriggerNode` /
    `isExecutable` / `nodeAcceptsInputType` / `nodeHasOutputType` reproduce the pinned lines,
    including the `continueErrorOutput` error-output append, the "Success" relabel of a single
    output, the deep-copied outputs (node type data never mutated) and the post-map filter
    quirk that makes a literal `undefined` entry throw
  - `checkConditions` / `getNodeFeatures` reproduce every `_cnd` operator, the empty-actual-values
    rule (`not` true, everything else false), value-based object equality and `@version` features
  - `displayParameter` / `displayParameterPath` reproduce show=all-rules / hide=any-rule,
    the expression short-circuit, `/`-root and `@version`/`@tool`/`@feature` resolution,
    `__rl` unwrapping and the `parameters`-root path rule
  - `validateNodeCredentials` / `isNodeConnected` / `isTriggerLikeNode` reproduce all 18 cases of
    `test/node-validation.test.ts`
  - `validateNodeParameters` and the `assertParamIs*` helpers reproduce every message, the
    aggregate "does not match any of the expected types" surface, sparse-array rejection via the
    index loop, `level: 'info'` and the thrown class identity (`NodeOperationError`)
  - `resolveRelativePath` reproduces all 8 oracle rows; `getParameterValueByPath`,
    `renameFormFields`, the value guards and every path helper of `properties.mjs`
    (merge/versioning/naming/descriptions/tool detection/subworkflow id) reproduce the pinned lines
  - differential vs the published `n8n-workflow@2.9.1` build: **0 divergences** across ≥200
    comparisons, with NOT-DIFFABLE surfaces listed explicitly and a falsifiability check
  - gate `N01`…`N07` PASS (`docs/isolation/evidence/node-lego-gate.json`); `verify:all` exit 0
