name: Post-Merge Verification & Resource Cleanup

on:
  pull_request:
    branches: [ main ]
    types: [ closed ]

# Deleting the PR head branch needs write access to refs; deleting that PR's
# workflow artifacts needs write access to actions. Nothing else.
permissions:
  contents: write
  actions: write

jobs:
  cleanup:
    name: Post-Merge Verification & Branch Cleanup
    runs-on: [ self-hosted, Windows, X64, rust-build, n8n-rust ]
    if: github.event.pull_request.merged == true
    steps:
      # Full history: when another PR merged in the meantime, main has advanced past
      # merge_commit_sha and a depth-1 checkout no longer contains it.
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Post-Merge Main Verification in Linux Container
        shell: powershell
        run: |
          $repoPath = $env:GITHUB_WORKSPACE -replace '\\', '/'
          docker run --rm `
            -v "${repoPath}:/workspace" `
            -w /workspace `
            n8n-rust-runner:latest `
            bash -lc "cargo check --workspace && cargo test -p n8n-workflow"

      # The runner verifies that merge_commit_sha is on main (fetching it if main moved on),
      # never deletes main or arena-manager (DEC-0019), and
      # exits 0 with a clear message when the head branch is already gone.
      - name: Execute Cleanup & Delete Task Branch
        shell: powershell
        env:
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $repoPath = $env:GITHUB_WORKSPACE -replace '\\', '/'
          docker run --rm `
            -v "${repoPath}:/workspace" `
            -w /workspace `
            -e "BRANCH_NAME=$env:BRANCH_NAME" `
            -e "MERGE_SHA=$env:MERGE_SHA" `
            -e "PR_NUMBER=$env:PR_NUMBER" `
            -e "GITHUB_TOKEN=$env:GITHUB_TOKEN" `
            n8n-rust-runner:latest `
            bash -lc 'python3 tools/orchestration/cleanup_runner.py --branch "$BRANCH_NAME" --merge-sha "$MERGE_SHA" --pr "$PR_NUMBER" --skip-tests'

      # Delete the merged PR workflow artifacts
      - name: Delete the merged PR workflow artifacts
        if: always()
        continue-on-error: true
        shell: powershell
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $repoPath = $env:GITHUB_WORKSPACE -replace '\\', '/'
          docker run --rm `
            -v "${repoPath}:/workspace" `
            -w /workspace `
            -e "HEAD_SHA=$env:HEAD_SHA" `
            -e "MERGE_SHA=$env:MERGE_SHA" `
            -e "PR_NUMBER=$env:PR_NUMBER" `
            -e "GITHUB_TOKEN=$env:GITHUB_TOKEN" `
            n8n-rust-runner:latest `
            bash -lc 'python3 tools/orchestration/cleanup_artifacts.py --sha "$HEAD_SHA" --sha "$MERGE_SHA" --pr "$PR_NUMBER" --apply'
