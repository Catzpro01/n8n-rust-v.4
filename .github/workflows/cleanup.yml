name: Post-Merge Verification & Resource Cleanup

on:
  pull_request:
    branches: [ main ]
    types: [ closed ]

jobs:
  cleanup:
    name: Post-Merge Verification & Branch Cleanup
    runs-on: [ self-hosted, linux ]
    if: github.event.pull_request.merged == true
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Post-Merge Main Verification (Level 0 + Level 2)
        run: |
          cargo check --workspace
          cargo nextest run -p n8n-workflow

      - name: Execute Cleanup & Delete Task Branch
        env:
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 tools/orchestration/cleanup_runner.py --branch $BRANCH_NAME --merge-sha $MERGE_SHA --pr $PR_NUMBER