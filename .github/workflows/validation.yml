name: Level 0 & Level 1 Validation (Parallel WSL Workers)

on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.arena/logs/**'
      - '.gitignore'
  push:
    branches:
      - 'runtime-kernel/*'
      - 'execution-engine/*'
      - 'data-plane/*'
      - 'node-system/*'
      - 'expression-engine/*'
      - 'workflow-compatibility/*'
      - 'verification/*'
      - 'performance/*'
      - 'security-sandbox/*'
      - 'infrastructure-orchestration/*'
      - 'arena-manager'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.arena/logs/**'
      - '.gitignore'

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format_and_check:
    name: Level 0 (Check & Format)
    runs-on: [ self-hosted, linux ]
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false
          lfs: false
          clean: false

      - name: Level 0 - Verify Formatting
        run: cargo fmt --all -- --check

      - name: Level 0 - Fast Workspace Lint
        run: cargo clippy --workspace -- -D warnings

  unit_tests:
    name: Level 1 (Affected Tests)
    runs-on: [ self-hosted, linux ]
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          submodules: false
          lfs: false
          clean: false

      - name: Level 1 - Affected Crate Unit Tests
        run: |
          # Deteksi crate yang berubah pada commit terakhir
          AFFECTED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null | grep '^crates/' | cut -d/ -f2 | sort -u | sed 's/^/-p /' | tr '\n' ' ')
          if [ -z "$AFFECTED" ]; then
            echo "No crate changes detected in recent commit, running default test set..."
            cargo nextest run -p n8n-workflow --test-threads=8
          else
            echo "Running nextest for affected crates: $AFFECTED"
            cargo nextest run $AFFECTED --test-threads=8
          fi

      - name: Report Build & Test Status to Supabase
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 tools/orchestration/report_ci_status.py --suite validation --status ${{ job.status }} --sha $COMMIT_SHA