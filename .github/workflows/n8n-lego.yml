name: n8n-lego Gate

# Phase P0 gate for the n8n-lego baseline (real n8n editor UI served by the LEGO
# runtime). It answers one question: does `git clone -> start -> n8n UI -> create
# workflow -> edit -> save -> execute -> inspect -> restart` still work?
#
#   architecture        backend LEGO isolation gate: domain boundaries,
#                       dependency direction, public/private surfaces, frozen
#                       legacy zone, contract versions, nested (sub-)LEGO rules
#                       and scale-out readiness - plus the selftest that proves
#                       the gate still catches real violations (P2.6 + P2.7)
#   gate                unit + REST/contract integration tests (incl. the P2.6
#                       foundation contract tests), then the release package
#                       (npm tarball + offline tarball + checksums)
#   clean-clone         git clone -> install -> start -> /healthz -> real n8n UI,
#                       browser smoke (owner setup -> create workflow -> canvas ->
#                       add node -> save -> execute -> execution result) -> P2 gate
#                       (settings visibility, route guards, 501 unsupported
#                       semantics) -> restart -> verify that the workflow survived
#   windows-portability self-hosted Windows worker: syntax/metadata probe plus
#                       optional WSL unit check when native Linux Node >= 22 is
#                       present on the worker.
#
# All repository CI execution is self-hosted-only on the canonical runner pool
# ([self-hosted, Windows, X64, rust-build, n8n-rust]). Linux runtime jobs execute
# inside the pinned local Linux Docker container (n8n-node-ci:latest) via
# tools/ci/run-linux-container.ps1. GitHub-hosted runners are never used.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'apps/n8n-lego/**'
      - 'tests/e2e/**'
      - 'tools/lego/**'
      - 'tools/workforce/**'
      - 'tools/ci/**'
      - 'docs/engineering-operations/workforce/**'
      - 'docs/engineering-operations/RUNNER-PROTOCOL.md'
      - 'docs/engineering-operations/runner-demand-controller.md'
      - '.arena/*.md'
      # Inputs the gate reads outside the paths above (TASK-0022): register and
      # decisions, ADRs, governance JSON, generated .ai, contracts, recorded
      # upstream goldens, and the engine + frontend packages the runtime loads.
      # Without them a register-only PR ran no workflow at all (PR #292).
      - 'docs/n8n-lego/**'
      - 'docs/architecture/adr/**'
      - 'docs/engineering-operations/workforce-governance.json'
      - '.ai/**'
      - 'contracts/**'
      - 'tests/reference/agent-4/golden/**'
      - 'packages/reconstructed-engine/**'
      - 'packages/frontend-lego/**'
      - 'scripts/release.sh'
      - 'package.json'
      - '.github/workflows/n8n-lego.yml'
  push:
    branches: [main]
    paths:
      - 'apps/n8n-lego/**'
      - 'tests/e2e/**'
      - 'tools/lego/**'
      - 'tools/workforce/**'
      - 'tools/ci/**'
      - 'docs/engineering-operations/workforce/**'
      - 'docs/engineering-operations/RUNNER-PROTOCOL.md'
      - 'docs/engineering-operations/runner-demand-controller.md'
      - '.arena/*.md'
      # Inputs the gate reads outside the paths above (TASK-0022): register and
      # decisions, ADRs, governance JSON, generated .ai, contracts, recorded
      # upstream goldens, and the engine + frontend packages the runtime loads.
      # Without them a register-only PR ran no workflow at all (PR #292).
      - 'docs/n8n-lego/**'
      - 'docs/architecture/adr/**'
      - 'docs/engineering-operations/workforce-governance.json'
      - '.ai/**'
      - 'contracts/**'
      - 'tests/reference/agent-4/golden/**'
      - 'packages/reconstructed-engine/**'
      - 'packages/frontend-lego/**'
      - 'scripts/release.sh'
      - 'package.json'
      - '.github/workflows/n8n-lego.yml'
  workflow_dispatch:

concurrency:
  group: n8n-lego-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  APP_DIR: apps/n8n-lego
  LEGO_URL: http://127.0.0.1:6200

jobs:
  architecture:
    name: Backend LEGO architecture gate (P2.6)
    runs-on: [self-hosted, Windows, X64, rust-build, n8n-rust]
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request'
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            /*
            !/reference/
            /reference/n8n/packages/@n8n/permissions/
          sparse-checkout-cone-mode: false

      - name: Run architecture and foundation gates in Linux container
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\tools\ci\run-linux-container.ps1" -Image n8n-node-ci:latest -Command @'
          set -euo pipefail
          git config --global --add safe.directory '*' 2>/dev/null || true

          ws=/var/tmp/arena-arch-ws
          rm -rf "$ws"
          mkdir -p "$ws"
          export_reports() {
            if [ -d "$ws" ]; then
              (
                cd "$ws"
                node tools/lego/architecture-gate.mjs --json > /workspace/architecture-gate.json || true
                node tools/lego/scale-out-readiness.mjs --json > /workspace/scale-out-readiness.json || true
                node tools/lego/foundation-gate.mjs --json > /workspace/foundation-gate.json || true
                node tools/lego/impact-graph.mjs --json > /workspace/impact-graph.json || true
              ) || true
              rm -rf "$ws"
            fi
          }
          trap export_reports EXIT

          # Extract directly from the Git packfile with pure LF line endings (avoids Windows CRLF conversion and NTFS bind-mount traversal).
          git -C /workspace archive HEAD -- . ':!reference' | tar -x -C "$ws"
          cd "$ws"

          echo "=== Node version ==="
          node -v

          echo "=== Domain boundaries, dependency direction, contract versions ==="
          node tools/lego/architecture-gate.mjs

          echo "=== The gate provably detects forbidden dependencies ==="
          node tools/lego/architecture-gate.mjs --selftest

          echo "=== The 501 capability contract matches the LEGO registry ==="
          node tools/lego/capability-conformance.mjs

          echo "=== The foundation gate provably detects incomplete contracts ==="
          node tools/lego/foundation-gate.mjs --selftest

          echo "=== Foundation 1.0 profiles are declared and coherent ==="
          node tools/lego/foundation-gate.mjs

          echo "=== The AI knowledge pack is not stale ==="
          node tools/lego/ai-pack.mjs --check

          echo "=== Scale-out readiness (no undeclared process-local coupling) ==="
          node tools/lego/scale-out-readiness.mjs
          '@

      # Evidence, not an assertion. The gate's verdict is already recorded by the JSON
      # the steps above wrote; this upload only archives it for humans. Nothing in the
      # repo ever downloads an artifact (`download-artifact` has zero hits repo-wide),
      # so these keep a short retention window for operator inspection.
      - name: Upload the architecture report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: n8n-lego-architecture-gate
          path: |
            architecture-gate.json
            scale-out-readiness.json
            foundation-gate.json
            impact-graph.json
          if-no-files-found: ignore
          retention-days: 2

  gate:
    name: Unit + integration tests and release package
    runs-on: [self-hosted, Windows, X64, rust-build, n8n-rust]
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request'
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            /*
            !/reference/
            /reference/n8n/packages/@n8n/permissions/
          sparse-checkout-cone-mode: false

      - name: Run unit, integration, workforce and release gates in Linux container
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\tools\ci\run-linux-container.ps1" -Image n8n-node-ci:latest -Command @'
          set -euo pipefail
          git config --global --add safe.directory '*' 2>/dev/null || true

          ws=/var/tmp/arena-gate-ws
          ci_bin=/var/tmp/arena-ci-bin
          rm -rf "$ws" "$ci_bin"
          mkdir -p "$ws" "$ci_bin"

          REAL_NODE="$(command -v node)"
          cat > "$ci_bin/node" <<SHIM
          #!/usr/bin/env bash
          if [ "\${1:-}" = "--test" ]; then
            shift
            exec "$REAL_NODE" --test --test-concurrency=2 "\$@"
          fi
          exec "$REAL_NODE" "\$@"
          SHIM
          chmod +x "$ci_bin/node"
          export PATH="$ci_bin:$PATH"

          export_release_evidence() {
            if [ -d "$ws" ]; then
              mkdir -p "$ws/dist" /workspace/dist
              (
                cd "$ws"
                {
                  echo "commit=${GITHUB_SHA:-$(git -C /workspace rev-parse HEAD 2>/dev/null || echo unknown)}"
                  echo "ref=${GITHUB_REF:-unknown}"
                  echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
                  echo "---"
                  for f in dist/n8n-lego-*.tgz dist/n8n-lego-*.tar.gz; do
                    [ -e "$f" ] || continue
                    printf '%s %s %s\n' "$(basename "$f")" "$(stat -c%s "$f")" "$(sha256sum "$f" | cut -d' ' -f1)"
                  done
                } > dist/release-manifest.txt
                echo "::notice::release manifest recorded ($(stat -c%s dist/release-manifest.txt) bytes); payload intentionally not uploaded"
                cat dist/release-manifest.txt
                cp -f dist/release-manifest.txt /workspace/dist/release-manifest.txt || true
                if [ -f dist/n8n-lego-0.1.0.tar.gz.sha256 ]; then
                  cp -f dist/n8n-lego-0.1.0.tar.gz.sha256 /workspace/dist/n8n-lego-0.1.0.tar.gz.sha256 || true
                fi
              ) || true
              rm -rf "$ws" "$ci_bin"
            fi
          }
          trap export_release_evidence EXIT

          # Extract directly from the Git packfile with pure LF line endings, plus reference/@n8n/permissions and .git metadata.
          git -C /workspace archive HEAD -- . ':!reference' | tar -x -C "$ws"
          git -C /workspace archive HEAD -- reference/n8n/packages/@n8n/permissions | tar -x -C "$ws"
          cp -a /workspace/.git "$ws/.git"

          cd "$ws"
          export APP_DIR="apps/n8n-lego"
          CATALOG_DIR="$ws/.ci-catalog"
          UNIT_DATA_DIR="$ws/.ci-unit-data"

          echo "=== Node and npm versions ==="
          node -v && npm -v

          echo "=== Install app dependencies ==="
          npm --prefix "$APP_DIR" ci --no-audit --no-fund

          echo "=== Fetch the pinned node catalog (n8n-nodes-base + icons + roles) ==="
          node "$APP_DIR/scripts/fetch-n8n-catalog.mjs" --dir "$CATALOG_DIR"
          node "$APP_DIR/scripts/fetch-n8n-roles.mjs" --dir "$CATALOG_DIR"
          test -f "$APP_DIR/data/roles.json"
          node -e "const roles=require('./' + process.env.APP_DIR + '/data/roles.json'); console.log('bundled roles.json present:', Object.keys(roles).length, 'groups')"

          echo "=== Frontend LEGO contract + architecture tests (P2.5, agent-1) ==="
          node --test packages/frontend-lego/test/*.test.mjs

          echo "=== Workforce control-plane tests (#259-#267) ==="
          node --test tools/workforce/test/*.test.mjs

          echo "=== Unit + REST contract integration tests ==="
          N8N_LEGO_CATALOG_DIR="$CATALOG_DIR" N8N_LEGO_USER_FOLDER="$UNIT_DATA_DIR" node --test apps/n8n-lego/test/*.test.mjs

          echo "=== Release build (npm package + offline tarball) ==="
          N8N_LEGO_CATALOG_DIR="$CATALOG_DIR" bash scripts/release.sh --no-docker

          echo "=== Verify the artifact checksums ==="
          (
            cd dist
            sha256sum -c n8n-lego-0.1.0.tar.gz.sha256
          )
          '@

      # Archive only the compact release manifest and SHA256 checksum file rather than
      # the reproducible ~16 MB tarball payload. The step above already verifies the
      # tarball via `sha256sum -c` against the built artifact in place.
      - name: Upload the release manifest
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: n8n-lego-release-manifest
          path: |
            dist/release-manifest.txt
            dist/n8n-lego-0.1.0.tar.gz.sha256
          if-no-files-found: ignore
          retention-days: 7

  clean-clone:
    name: Clean clone → start → health → browser smoke → restart
    runs-on: [self-hosted, Windows, X64, rust-build, n8n-rust]
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request'
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            /*
            !/reference/
            /reference/n8n/packages/@n8n/permissions/
          sparse-checkout-cone-mode: false

      - name: Run clean-clone deploy and browser smoke in Linux container
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\tools\ci\run-linux-container.ps1" -Image n8n-node-ci:latest -Command @'
          set -euo pipefail
          git config --global --add safe.directory '*' 2>/dev/null || true

          CLEAN_TMP=/var/tmp/arena-clean-clone
          rm -rf "$CLEAN_TMP" /workspace/.ci-clean-clone-evidence
          mkdir -p "$CLEAN_TMP"

          export APP_DIR="apps/n8n-lego"
          export LEGO_URL="http://127.0.0.1:6200"

          cleanup_clean_clone() {
            if [ -f "$CLEAN_TMP/lego.pid" ]; then
              kill "$(cat "$CLEAN_TMP/lego.pid")" 2>/dev/null || true
            fi
            mkdir -p /workspace/.ci-clean-clone-evidence
            for item in shots p2-shots lego-start.log lego-restart.log smoke-state.json settings-visibility-p2.json; do
              if [ -e "$CLEAN_TMP/$item" ]; then
                cp -a "$CLEAN_TMP/$item" /workspace/.ci-clean-clone-evidence/ || true
              fi
            done
            rm -rf "$CLEAN_TMP"
          }
          trap cleanup_clean_clone EXIT

          echo "=== Clone the repository into a directory that has no local state ==="
          TARGET_SHA="${GITHUB_SHA:-$(git -C /workspace rev-parse HEAD)}"
          git clone --no-checkout --quiet --no-hardlinks /workspace "$CLEAN_TMP/clean-clone"
          cd "$CLEAN_TMP/clean-clone"
          git config core.autocrlf false
          git checkout --quiet "$TARGET_SHA" -- . ':!reference'
          git checkout --quiet "$TARGET_SHA" -- reference/n8n/packages/@n8n/permissions
          echo "clone at $(git log --oneline -1)"
          for path in "$APP_DIR/node_modules" "$APP_DIR/vendor" dist data; do
            if [ -e "$path" ]; then echo "::error::unexpected $path in the clone"; exit 1; fi
          done
          echo "clean clone verified: no node_modules, vendor, dist or data directory"

          echo "=== Install app dependencies in the clone ==="
          npm --prefix "$APP_DIR" ci --no-audit --no-fund

          echo "=== Start the instance on a fresh data directory ==="
          N8N_LEGO_USER_FOLDER="$CLEAN_TMP/lego-data" N8N_LEGO_PORT=6200 N8N_LEGO_HOST=127.0.0.1 \
            setsid nohup node "$APP_DIR/bin/n8n-lego.mjs" start > "$CLEAN_TMP/lego-start.log" 2>&1 < /dev/null &
          echo $! > "$CLEAN_TMP/lego.pid"
          echo "started pid $(cat "$CLEAN_TMP/lego.pid")"

          echo "=== Wait for /healthz (first start bootstraps the node catalog) ==="
          # Runner protocol: poll every 1s (180 x 1s = 180s budget).
          healthy=0
          for attempt in $(seq 1 180); do
            if curl -fsS "$LEGO_URL/healthz" > "$CLEAN_TMP/health.json"; then
              cat "$CLEAN_TMP/health.json"
              healthy=1
              break
            fi
            sleep 1
          done
          if [ "$healthy" -ne 1 ]; then
            echo "::error::health endpoint never answered"
            tail -60 "$CLEAN_TMP/lego-start.log" || true
            exit 1
          fi

          echo "=== Assert the health payload and the served catalog ==="
          CLEAN_TMP="$CLEAN_TMP" node -e '
            const fs = require("fs");
            const health = JSON.parse(fs.readFileSync(process.env.CLEAN_TMP + "/health.json", "utf8"));
            if (health.status !== "ok") throw new Error("health status " + health.status);
            if (health.checks?.editorUi !== "ok") throw new Error("editor UI not ok");
            if (health.checks?.nodeCatalog !== "ok") throw new Error("node catalog not ok");
            console.log("health ok", JSON.stringify(health));
          '
          nodes="$(curl -fsS "$LEGO_URL/rest/types/nodes.json" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{const j=JSON.parse(d);console.log(Object.keys(j.data ?? j).length)})')"
          echo "node types served: $nodes"
          if [ "$nodes" -lt 400 ]; then echo "::error::the node catalog is incomplete ($nodes node types)"; exit 1; fi
          curl -fsS "$LEGO_URL/rest/settings" >/dev/null && echo "rest settings ok"

          echo "=== Install the browser smoke harness (puppeteer) ==="
          PREINSTALLED_CHROME="$(find /ms-playwright -type f -name chrome -executable 2>/dev/null | head -n 1 || true)"
          if [ -n "$PREINSTALLED_CHROME" ]; then
            export CHROME_PATH="$PREINSTALLED_CHROME"
            export PUPPETEER_SKIP_DOWNLOAD=true
            echo "using preinstalled Chromium: $CHROME_PATH"
          fi
          npm --prefix tests/e2e ci --no-audit --no-fund

          echo "=== Browser smoke - create workflow -> add node -> save -> execute -> inspect ==="
          LEGO_SMOKE_STATE="$CLEAN_TMP/smoke-state.json" \
          LEGO_SMOKE_SHOTS="$CLEAN_TMP/shots" \
            node tests/e2e/lego-smoke.mjs "$LEGO_URL" --mode=create

          echo "=== P2 browser gate - settings visibility, route guards, unsupported semantics ==="
          LEGO_P2_EVIDENCE="$CLEAN_TMP/settings-visibility-p2.json" \
          LEGO_P2_SHOTS="$CLEAN_TMP/p2-shots" \
            node tests/e2e/settings-compat.mjs "$LEGO_URL"

          echo "=== Restart the instance on the same data directory ==="
          kill "$(cat "$CLEAN_TMP/lego.pid")"
          for attempt in $(seq 1 30); do
            if ! curl -fsS "$LEGO_URL/healthz" >/dev/null 2>&1; then break; fi
            sleep 1
          done
          N8N_LEGO_USER_FOLDER="$CLEAN_TMP/lego-data" N8N_LEGO_PORT=6200 N8N_LEGO_HOST=127.0.0.1 \
            setsid nohup node "$APP_DIR/bin/n8n-lego.mjs" start > "$CLEAN_TMP/lego-restart.log" 2>&1 < /dev/null &
          echo $! > "$CLEAN_TMP/lego.pid"
          # Runner protocol: poll every 1s (120 x 1s = 120s budget).
          restarted=0
          for attempt in $(seq 1 120); do
            if curl -fsS "$LEGO_URL/healthz" >/dev/null; then
              echo "restarted and healthy"
              restarted=1
              break
            fi
            sleep 1
          done
          if [ "$restarted" -ne 1 ]; then
            echo "::error::the instance did not come back after the restart"
            tail -60 "$CLEAN_TMP/lego-restart.log" || true
            exit 1
          fi

          echo "=== Browser smoke - the workflow survived the restart ==="
          LEGO_SMOKE_STATE="$CLEAN_TMP/smoke-state.json" \
          LEGO_SMOKE_SHOTS="$CLEAN_TMP/shots" \
            node tests/e2e/lego-smoke.mjs "$LEGO_URL" --mode=verify
          '@

      # Failure evidence: screenshots and server logs are what make a red clean-clone
      # run diagnosable, so this keeps `if: always()`. The upload is non-fatal, because
      # the smoke verdict was already asserted by the verify step above.
      - name: Upload smoke evidence and server logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: n8n-lego-clean-clone-evidence
          path: |
            .ci-clean-clone-evidence/shots
            .ci-clean-clone-evidence/p2-shots
            .ci-clean-clone-evidence/lego-start.log
            .ci-clean-clone-evidence/lego-restart.log
            .ci-clean-clone-evidence/smoke-state.json
            .ci-clean-clone-evidence/settings-visibility-p2.json
          if-no-files-found: ignore
          retention-days: 3

  windows-portability:
    name: Windows worker portability probe (runtime tests are Linux)
    runs-on: [self-hosted, Windows, X64, rust-build, n8n-rust]
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request'
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            /*
            !/reference/
            /reference/n8n/packages/@n8n/permissions/
          sparse-checkout-cone-mode: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.18'

      - name: Every source file parses on Windows
        shell: powershell
        run: |
          $files = @()
          foreach ($dir in @('apps/n8n-lego/bin', 'apps/n8n-lego/src', 'apps/n8n-lego/scripts', 'apps/n8n-lego/test', 'tests/e2e')) {
            $files += Get-ChildItem -Path $dir -Recurse -Filter *.mjs -File | ForEach-Object { $_.FullName }
          }
          foreach ($file in $files) { node --check $file; if ($LASTEXITCODE -ne 0) { throw "syntax error in $file" } }
          Write-Host "checked $($files.Count) module files"

      - name: The runtime declares its platform and Node requirement
        shell: powershell
        run: |
          $pkg = Get-Content 'apps/n8n-lego/package.json' -Raw | ConvertFrom-Json
          if ($pkg.os -notcontains 'linux') { throw 'apps/n8n-lego must declare "os": ["linux"] while the runtime is Linux-only' }
          if ($pkg.engines.node -ne '>=22.18.0') { throw "unexpected engines.node $($pkg.engines.node)" }
          Write-Host "os=$($pkg.os -join ',') engines.node=$($pkg.engines.node)"
          Write-Host '::notice::The n8n-lego runtime is Linux-only; the unit, integration, clean-clone and browser gates run in the self-hosted Linux container.'

      - name: Run the unit tests inside WSL when this worker has one
        # Best effort: this is a laptop worker, not the runtime's native host OS.
        # The blocking Linux runtime gate is the self-hosted Linux container
        # clean-clone job, so a quirk of WSL on this worker must not paint the
        # whole gate red - it reports a warning with the failing output instead.
        #
        # ASCII only in this block: Windows PowerShell 5.1 reads the generated
        # script as ANSI, so a UTF-8 em-dash (bytes E2 80 94) lands as byte 0x94
        # which its tokenizer treats as a smart double quote.
        shell: powershell
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          $wsl = Get-Command wsl.exe -ErrorAction SilentlyContinue
          if (-not $wsl) {
            Write-Host '::notice::No WSL on this worker - the authoritative Linux runtime gate is the self-hosted Linux container clean-clone job.'
            exit 0
          }

          # The distro must own its Node: WSL interop surfaces the Windows
          # node.exe on PATH (process.platform 'win32'), and npm then refuses a
          # linux-only install ("notsup Actual os: win32").
          $nodePlat = (wsl.exe -- bash -lc 'node -p "process.platform"' 2>&1 | Out-String).Trim()
          if ($nodePlat -ne 'linux') {
            Write-Host "::notice::WSL on this worker has no native Linux Node (interop node reports '$nodePlat') - the authoritative Linux runtime gate is the self-hosted Linux container clean-clone job."
            exit 0
          }
          $node = (wsl.exe -- bash -lc 'node -v' 2>&1 | Out-String).Trim()
          $nodeOk = $false
          if ($node.StartsWith('v')) {
            $dot = $node.IndexOf('.')
            if ($dot -gt 1) {
              $major = 0
              if ([int]::TryParse($node.Substring(1, $dot - 1), [ref]$major)) {
                if ($major -ge 22) { $nodeOk = $true }
              }
            }
          }
          if (-not $nodeOk) {
            Write-Host "::notice::WSL has no usable Node >= 22 (got '$node') - the authoritative Linux runtime gate is the self-hosted Linux container clean-clone job."
            exit 0
          }
          Write-Host "WSL Node $node - preparing a Linux copy of the app"

          # wslpath receives its argv through wsl.exe, which can strip the
          # backslashes on the way (the mangled name then fails with "File name
          # too long"). Convert in PowerShell instead: C: drive path -> /mnt/c/... ,
          # the standard WSL drive-mount layout.
          function Convert-ToWslPath([string]$winPath) {
            # [char] codes keep this block free of quote/backslash escaping rules.
            $bs = [char]92
            $p = $winPath.Trim().TrimEnd($bs, [char]47)
            if ($p.Length -ge 3 -and $p[1] -eq [char]58 -and ($p[2] -eq $bs -or $p[2] -eq $bs -or $p[2] -eq [char]47)) {
              return "/mnt/" + $p.Substring(0, 1).ToLowerInvariant() + $p.Substring(2).Replace($bs, [char]47)
            }
            return $p.Replace($bs, [char]47)
          }
          $repo = Convert-ToWslPath "$PWD"
          $script = Join-Path $env:RUNNER_TEMP 'n8n-lego-wsl-unit.sh'
          $lines = @(
            'set -euo pipefail',
            'repo="$1"',
            'work=/tmp/n8n-lego-wsl',
            'rm -rf "$work"; mkdir -p "$work"',
            'cp -a "$repo/apps" "$repo/packages" "$work/"',
            'cd "$work"',
            'npm --prefix apps/n8n-lego ci --no-audit --no-fund >/dev/null',
            'node apps/n8n-lego/scripts/fetch-n8n-catalog.mjs --dir "$work/.catalog" >/dev/null',
            'N8N_LEGO_CATALOG_DIR="$work/.catalog" N8N_LEGO_USER_FOLDER="$work/.data" node --test apps/n8n-lego/test/*.test.mjs'
          )
          # LF only: Set-Content writes CRLF, and the trailing CR turns
          # 'set -euo pipefail' into 'set -euo pipefail<CR>' -> 'invalid option name'.
          [System.IO.File]::WriteAllText($script, ($lines -join [char]10) + [char]10)
          $scriptInWsl = Convert-ToWslPath $script

          # bash -lc (login) so the PATH matches the checks above: a plain
          # non-login `bash` skips ~/.profile and misses nvm/fnm/volta installs.
          wsl.exe -- bash -lc "bash '$scriptInWsl' '$repo'"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::WSL unit test run exited with code $LASTEXITCODE (non-blocking - see clean-clone for the Linux gate)"
          }
          exit 0
