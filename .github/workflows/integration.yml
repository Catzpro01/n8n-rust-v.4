name: Level 2 Integration & Conformance Suite (Matrix Workers)

on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.arena/logs/**'
      - '.gitignore'

concurrency:
  group: integration-${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded runs on PR refs only; every push to a protected branch keeps its own run (merge evidence).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  integration_workspace:
    name: Level 2 Workspace Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ linux, windows ]
    runs-on: [ self-hosted, '${{ matrix.os }}', x64, rust-build, n8n-rust ]
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false
          lfs: false

      - name: Level 2 - Full Rust Workspace Tests
        run: cargo test --workspace

  conformance:
    name: Level 2 Conformance LEGO & Node Catalog
    runs-on: [ self-hosted, linux, x64, rust-build, n8n-rust ]
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false
          lfs: false

      - name: Level 2 - Localization & Catalog Tests
        run: node --test packages/reconstructed-engine/localization.test.mjs packages/reconstructed-engine/node-catalog.test.mjs

      - name: Level 2 - Execution LEGO Conformance Tests
        run: node --experimental-strip-types --test packages/execution-lego/test/02-runtime.test.mjs packages/execution-lego/test/03-context-recovery.test.mjs

      - name: Report Integration Status to Supabase
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 tools/orchestration/report_ci_status.py --suite integration --status ${{ job.status }} --sha $COMMIT_SHA