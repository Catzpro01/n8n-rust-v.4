name: Level 2 Integration & Conformance Suite (Matrix Workers)

on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.arena/logs/**'
      - '.gitignore'

concurrency:
  group: integration-${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded runs on PR refs only; every push to a protected branch keeps its own run (merge evidence).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Linux workspace tests: Windows runner + Docker container
  integration_linux:
    name: Level 2 Workspace Tests (linux)
    runs-on: [ self-hosted, Windows, X64, rust-build, n8n-rust ]
    container:
      image: n8n-rust-runner:latest
    defaults:
      run:
        shell: bash
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          submodules: false
          lfs: false

      - name: Level 2 - sccache daemon self-heal
        shell: bash
        run: |
          if command -v sccache >/dev/null 2>&1; then
            sccache --stop-server 2>/dev/null || true
            if sccache --start-server 2>/dev/null; then
              echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
              sccache --show-stats 2>/dev/null || true
            else
              echo "::warning::sccache daemon gagal start, kompilasi tanpa cache"
              echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
            fi
          fi

      - name: Level 2 - Full Rust Workspace Tests
        run: cargo test --workspace

  # Windows native workspace tests
  integration_windows:
    name: Level 2 Workspace Tests (windows)
    runs-on: [ self-hosted, Windows, X64, rust-build, n8n-rust ]
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          submodules: false
          lfs: false

      - name: Level 2 - sccache daemon self-heal (Windows)
        shell: powershell
        run: |
          $scc = Get-Command sccache -ErrorAction SilentlyContinue
          if ($scc) {
            sccache --stop-server 2>$null
            Start-Sleep -Milliseconds 500
            Get-Process -Name "sccache" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            $out = & sccache --start-server 2>&1
            if ($LASTEXITCODE -eq 0) {
              "RUSTC_WRAPPER=sccache" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
              sccache --show-stats 2>$null
            } else {
              Write-Host "::warning::sccache daemon gagal start, kompilasi tanpa cache"
              "RUSTC_WRAPPER=" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            }
          }

      - name: Level 2 - Full Rust Workspace Tests
        run: cargo test --workspace

  # Conformance tests: container-based
  conformance:
    name: Level 2 Conformance LEGO & Node Catalog
    runs-on: [ self-hosted, Windows, X64, rust-build, n8n-rust ]
    container:
      image: n8n-rust-runner:latest
    defaults:
      run:
        shell: bash
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          submodules: false
          lfs: false

      - name: Level 2 - Localization & Catalog Tests
        run: node --test packages/reconstructed-engine/localization.test.mjs packages/reconstructed-engine/node-catalog.test.mjs

      - name: Level 2 - Execution LEGO Conformance Tests
        run: node --experimental-strip-types --test packages/execution-lego/test/02-runtime.test.mjs packages/execution-lego/test/03-context-recovery.test.mjs
